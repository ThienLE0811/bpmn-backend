app.name=BPMN Backend
app.version=1.0.0-SNAPSHOT
app.environment=development
server.port=8080
server.host=0.0.0.0

# Database Configuration (PostgreSQL)
# Local dev only. In production set the DATABASE_URL env var instead
# (e.g. Neon's postgresql://user:pass@host/db?sslmode=require) -
# see DatabaseConfig.applyDatabaseUrl, it takes priority over these values.
db.url=jdbc:postgresql://localhost:5432/los
db.username=postgres
db.password=postgres
db.driver-class-name=org.postgresql.Driver
db.pool.maximum-pool-size=10
# 0 so the pool doesn't hold idle connections open - required for Neon's
# free tier to scale the compute back to zero when the app is idle.
db.pool.minimum-idle=0
db.pool.idle-timeout=30000
db.pool.connection-timeout=10000
